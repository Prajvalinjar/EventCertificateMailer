services:
  - type: web
    name: event-certificate-mailer
    env: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      # Resend API configuration (set your real secret in the Render Dashboard)
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: EMAIL_FROM_NAME
        value: Event Certificate Team
      - key: ALLOWED_ORIGIN
        value: "*"
