services:
  - type: web
    name: event-certificate-mailer
    env: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_FROM_NAME
        value: Event Certificate Team
      # Set your actual Gmail credentials in the Render Dashboard (sync: false protects them from Git)
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
